name: Phoenix Proof Cycle
on:
  push:
    paths:
      - "tools/phoenix_proof_cycle.py"
      - "tools/phoenix_receipt_contract.py"
      - "tools/test_phoenix_receipt_contract.py"
      - ".github/workflows/phoenix-proof-cycle.yml"
  pull_request:
    paths:
      - "tools/phoenix_proof_cycle.py"
      - "tools/phoenix_receipt_contract.py"
      - "tools/test_phoenix_receipt_contract.py"
      - ".github/workflows/phoenix-proof-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic proof-cycle tests
        run: python tools/phoenix_proof_cycle.py --self-test
      - name: Run independent receipt-contract tests
        run: python tools/test_phoenix_receipt_contract.py
      - name: Verify a clean cycle
        run: |
          python tools/phoenix_proof_cycle.py --task "CI acceptance cycle" --output phoenix-proof-cycle.json
          python tools/phoenix_receipt_contract.py phoenix-proof-cycle.json
      - name: Verify fault detection and bounded repair
        run: |
          python tools/phoenix_proof_cycle.py --task "CI seeded fault" --inject-defect --output phoenix-proof-cycle-repaired.json
          python tools/phoenix_receipt_contract.py phoenix-proof-cycle-repaired.json
      - name: Verify unrepaired failure remains explicit
        run: |
          set +e
          python tools/phoenix_proof_cycle.py --task "CI unrepaired fault" --inject-defect --no-repair --output phoenix-proof-cycle-failed.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected explicit FAIL exit code 2, received $status"
            exit 1
          fi
          python tools/phoenix_receipt_contract.py phoenix-proof-cycle-failed.json
      - name: Upload reproducible cycle receipts
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-proof-cycle-receipts
          path: |
            phoenix-proof-cycle.json
            phoenix-proof-cycle-repaired.json
            phoenix-proof-cycle-failed.json
          if-no-files-found: error
          retention-days: 30
